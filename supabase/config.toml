# Supabase configuration file

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[auth]
enabled = true
jwt_expiry = 3600
enable_signup = true
email_confirmations = true

[auth.email]
enable_signup_verification = true
template = {}

[analytics]
enabled = false
port = 54327
vector_port = 54328

# 엣지 함수 없음.
# cast_vote / generate_voter_codes 는 20260730000100 에서 제거했다. 근거:
#   - 이 프로젝트에 배포되어 있지 않았고(라이브는 Cowork 의 cw-* 뿐),
#   - 호출 대상 RPC(cast_anonymous_vote / generate_voter_codes_batch)가
#     voter_registry 기반 기표 경로로 대체된 레거시였으며,
#   - verify_jwt = false 로 선언돼 있어 배포되는 순간 인증 없이 호출 가능했다.
# 현행 기표·발급 경로는 Next.js API 라우트(서비스롤)다.